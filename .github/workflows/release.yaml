name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print the computed version without releasing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: oskarrn93/github-actions/.github/workflows/semver-release.yml@e47e3cc97693c6043109525db91f5d2646963f2f # v1
    with:
      dry-run: ${{ inputs.dry-run || false }}
      move-major-tag: false
      client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
