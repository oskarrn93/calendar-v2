name: "Publish image to AWS ECR"
description: "Publish image to AWS ECR. Expects AWS credentials to already be configured."

inputs:
  image_tag:
    description: "The image tag"
    required: true
  aws_ecr_repository:
    description: "The AWS ECR repository name"
    required: true

runs:
  using: "composite"
  steps:
    - name: Log in to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push Docker image to ECR
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        tags: |
          ${{ steps.ecr-login.outputs.registry }}/${{ inputs.aws_ecr_repository }}:${{ inputs.image_tag }}
          ${{ steps.ecr-login.outputs.registry }}/${{ inputs.aws_ecr_repository }}:latest
        # Lambda rejects the OCI image index that buildx produces when it attaches provenance.
        provenance: false
