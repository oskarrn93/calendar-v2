name: "Deploy AWS Lambda"
description: "Deploy AWS Lambda with Docker image from ECR. Expects AWS credentials to already be configured."

inputs:
  image_tag:
    description: "The image tag"
    required: true
  aws_region:
    description: "The AWS region"
    required: true
  aws_account_id:
    description: "The AWS Account ID"
    required: true
  aws_ecr_repository:
    description: "The AWS ECR repository name"
    required: true
  aws_lambda_function_name:
    description: "The AWS Lambda function name"
    required: true

runs:
  using: "composite"
  steps:
    - name: Deploy to AWS Lambda
      uses: aws-actions/aws-lambda-deploy@v1.1.0
      with:
        function-name: ${{ inputs.aws_lambda_function_name }}
        package-type: Image
        image-uri: ${{ inputs.aws_account_id }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.aws_ecr_repository }}:${{ inputs.image_tag }}
